.run-tests:
  tags:
    - fast-test
  stage: test
  # In order to change the janeway image used, either
  # - git push -o ci.variable="JANEWAY_VERSION=abc123" ...
  # - Build → Pipelines → New pipeline, add variable and run
  #   https://gitlab.sissamedialab.it/wjs/wjs-profile-project/-/pipelines/new
  image: registry.gitlab.sissamedialab.it/wjs/janeway/debian-python-git-janeway:${JANEWAY_VERSION}

  # NB: Must match with test_settings.DATABASES
  variables:
    JANEWAY_VERSION: "production"
    POSTGRES_USER: janeway
    POSTGRES_PASSWORD: janeway
    POSTGRES_DB: janeway
    # used by `pytest ...`:
    DJANGO_SETTINGS_MODULE: core.cicd_test_settings
    # used by `manage.py ...`:
    JANEWAY_SETTINGS_MODULE: core.cicd_settings
    # Hydra is a third-party Janeway plugin (article/journal linking): `setup_environment`
    # clones it into src/plugins. The job token needs wjs/hydra to allow this project in its
    # "CI/CD job token allowlist" (Settings > CI/CD > Job token permissions).
    HYDRA_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sissamedialab.it/wjs/hydra.git"
    HYDRA_REF: "wjs-production"
    # Use the following after force-pushes:
    GIT_STRATEGY: clone
    # see e.g.:
    # - https://docs.gitlab.com/ee/ci/runners/configure_runners.html#git-strategy
    # - https://stackoverflow.com/a/66519431/1581629
    PYTHONPATH: ${CI_PROJECT_DIR}

  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:13.8
      alias: db
      command: [
        "postgres",
        "-c", "max_locks_per_transaction=2048"
      ]


  script:
    - cp setup_environment /usr/local/bin/
    - setup_environment
    - cd /janeway/src
    - pytest -c ${CI_PROJECT_DIR}/pytest.ini ${CI_PROJECT_DIR}/ -v -n 6 --reverse -m "not fix_labels" --create-db


# lintme:
#   extends: .run-tests
