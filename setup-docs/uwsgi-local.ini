[uwsgi]
#plugins = python
# plugins = 0:python3
#async = 3

# plugins = gevent
# gevent = 3

# Django-related settings
# set an environment variable
# env = DJANGO_SETTINGS_MODULE=core.janeway_global_settings --> RuntimeError: Model class wjs.jcom_profile.models.JCOMProfile doesn't declare an explicit app_label and isn't in an application in INSTALLED_APPS.

env = DJANGO_SETTINGS_MODULE=core.settings
# --> RuntimeError: Model class django.contrib.contenttypes.models.ContentType doesn't declare an explicit app_label and isn't in an application in INSTALLED_APPS.

# env = DJANGO_SETTINGS_MODULE=core.janeway_global_settings
# env = JANEWAY_SETTINGS_MODULE=core.settings

# env = JANEWAY_SETTINGS_MODULE=core.janeway_global_settings

# DROP # Not needed, probably because we run from django's root dir and we
# DROP # point directly to the wsgi module (core/wsgi.py), which does it's
# DROP # own magic.
# the virtualenv (full path)
virtualenv  = /home/gamboz/.virtualenvs/j9u
# the base directory (full path)
chdir = /home/gamboz/projects/WJS-Janeway/j9/src
# Django's asgi file
module = wjs.channels.asgi
http-websockets = true
#env = PATH=/usr/local/texlive/2023/bin/x86_64-linux:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games

# process-related settings
# master
# master          = true

# maximum number of worker processes
# processes = 4
processes = 1

# the socket (use the full path to be safe)
# NB: do not use /tmp when running under systemd: either uwsgi and/or apache!
socket          = /home/gamboz/janeway.sock
# chmod-socket = 664
chmod-socket = 666
#
# It is uwsgi that creates the socket, not apache
# and the socket is deleted when uwsgi stops.


# Default protocol is uwsgi
# protocol = uwsgi

# clear environment on exit
vacuum = true


# create a pidfile
safe-pidfile = /tmp/janeway-uwsgi-master.pid

# enable post buffering
# see e.g. https://stackoverflow.com/a/20216582/1581629
post-buffering = 4096

# respawn processes taking more than 20 seconds
harakiri = 30

# limit the project to 128 MB
# limit-as = 128

# respawn processes after serving 5000 requests
max-requests = 5000

# see also uid/gid in /etc/uwsgi-emperor/emperor.ini
# uid = wjs
# gid = www-data

# background the process & log
# This is uwsgi's log. Janeway logs to other files (see settings.py).
daemonize = /tmp/uwsgi.log
log-backupname = /tmp/uwsgi-upto-@(exec://date +%%Y-%%m-%%d).log
log-maxsize = 20000000

# umask = 002

enable-threads = true

# log-format = %(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size) "%(referer)" "%(uagent)"

# alarm = mailme cmd:mail -s 'uWSGI alarm' -a 'From: janeway@jannon.ud.sissamedialab.it' wjs-support@medialab.sissa.it
# log-alarm = mailme Traceback
