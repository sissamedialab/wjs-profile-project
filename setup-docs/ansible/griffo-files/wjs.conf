ServerAdmin wjs-sysadmin@medialab.sissa.it
Define SOCKET_NAME /run/wjs/daphne.sock


<VirtualHost *:80>
    ServerName  import-journals.griffo.wjapp.it
    ServerAlias import-jcom.griffo.wjapp.it
    ServerAlias import-jcomal.griffo.wjapp.it
    ServerAlias import-jquant.griffo.wjapp.it
    ServerAlias import-jhep.griffo.wjapp.it
    ServerAlias import-jcap.griffo.wjapp.it
    ServerAlias import-jstat.griffo.wjapp.it

    DocumentRoot /var/www/hosts/test-journals/html
    CustomLog ${APACHE_LOG_DIR}/janeway80-access.log combined
    ErrorLog  ${APACHE_LOG_DIR}/janeway80-error.log

    RewriteEngine On
    RewriteRule ^(.*)$          https://%{SERVER_NAME}$1 [last,redirect=301]
</VirtualHost>


<VirtualHost *:443>
    Define NAME journals
    ServerName import-${NAME}.griffo.wjapp.it
    ServerAlias ${NAME}-griffo.sissamedialab.it
    Define LOG_NAME	${NAME}

    DocumentRoot /var/www/hosts/import-${NAME}/html
    <Directory   /var/www/hosts/import-${NAME}/html >
    </Directory>

    Include "conf-available/wjs/apache-static-files-block.inc"
    Include "conf-available/wjs/apache-log-and-ssl.inc"
    Include "conf-available/wjs/apache-proxy-and-socket-daphne.inc"
</VirtualHost>


<VirtualHost *:443>
    Define NAME jcom
    ServerName import-${NAME}.griffo.wjapp.it
    ServerAlias ${NAME}-griffo.sissamedialab.it
    Define LOG_NAME	${NAME}

    DocumentRoot /var/www/hosts/import-${NAME}/html
    <Directory   /var/www/hosts/import-${NAME}/html >
    </Directory>

    Include "conf-available/wjs/apache-static-files-block.inc"
    Include "conf-available/wjs/apache-log-and-ssl.inc"

    # Include JCOM redirects maintained in the project's repo

    Include "conf-available/wjs/apache-proxy-and-socket-daphne.inc"
</VirtualHost>


