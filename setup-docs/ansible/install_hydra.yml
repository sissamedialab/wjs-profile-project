# Install the Hydra plugin.
#
# Runs against both test and production; production is opt-in only (see
# inventories/prod.yml and tasks/assert-production-opt-in.yml).
#
# Test instance:
#   ansible-playbook install_hydra.yml -e instance="t4"
#
# Production (note the explicit inventory and confirmation):
#   ansible-playbook -i inventories/prod.yml install_hydra.yml \
#       -e instance="" -e confirm=PROD --check --diff   # dry run first
#   ansible-playbook -i inventories/prod.yml install_hydra.yml \
#       -e instance="" -e confirm=PROD
#
# `instance` is mandatory and has no default: pass an empty value to work on an
# unsuffixed instance (/home/wjs/janeway). A silent default would happily build
# paths for a machine you did not mean to touch.

---
- hosts: janeway
  remote_user: wjs
  # One machine at a time, and stop the whole play at the first failure rather
  # than half-installing the plugin across the production fleet.
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_user: wjs
    wjs_user_id: 1000
    instance_name: "{{ instance | mandatory }}"
    # "~" (not "+") because it stringifies its operands: a numeric instance name
    # concatenates instead of raising a type error. "-e instance=2024" is safe
    # either way (that form yields a str), but "-e @vars.yml" or an inventory
    # var holding 2024 gives an int, which "+" cannot join to a string.
    suffix: "{{ '-' ~ instance_name if instance_name else '' }}"
    full_name: "janeway{{ suffix }}"
    workon_home: /home/wjs/.virtualenvs/
    venv_root: "{{ workon_home }}/{{ full_name }}"
    python: "{{ venv_root }}/bin/python"
    pip: "{{ venv_root }}/bin/pip"
    ansible_ssh_common_args: "-o ForwardAgent=yes"
    # Third-party Janeway plugin, cloned into src/plugins (see below)
    hydra_repo: git@gitlab.sissamedialab.it:wjs/hydra.git
    # Override with -e hydra_ref=<branch/tag> to stage a new version on a test
    # instance before it reaches wjs-production.
    hydra_version: "{{ hydra_ref | default('wjs-production') }}"

  pre_tasks:

    - name: Guard against unintended production runs
      import_tasks: tasks/assert-production-opt-in.yml

  tasks:

    # Hydra is a third-party Janeway plugin (linking of articles across and within
    # journals). It is not distributed as a python package, so we clone it directly
    # into src/plugins, where Janeway picks it up (see core.plugin_installed_apps).
    # The "install_plugins" call below (no arguments) registers it in the DB.
    - name: Clone the hydra plugin
      git:
        repo: "{{ hydra_repo }}"
        dest: "/home/wjs/{{ full_name }}/src/plugins/hydra"
        version: "{{ hydra_version }}"
        accept_hostkey: true

    - name: Install hydra
      command: "{{ python }} -mmanage install_plugins"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
