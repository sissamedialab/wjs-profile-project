# (Re)install an instance's systemd user units: gunicorn and qcluster.
#
# Renders systemd/gunicorn.service.j2 and systemd/qcluster.service.j2 into
# ~/.config/systemd/user/, the same way wjs-test__create-instance__wjs.yml does
# when an instance is born, but touching nothing else: use it to roll out a
# change to the unit templates on an existing instance. Only the units whose
# file actually changed are restarted (after a daemon-reload); an unchanged
# unit is left running.
#
# Runs against both test and production; production is opt-in only (see
# inventories/prod.yml and tasks/assert-production-opt-in.yml).
#
# Test instance:
#   ansible-playbook install-systemd-units.yml -e instance="t3" --check --diff   # dry run first
#   ansible-playbook install-systemd-units.yml -e instance="t3"
#
# Production (note the explicit inventory and confirmation):
#   ansible-playbook -i inventories/prod.yml install-systemd-units.yml \
#       -e instance="" -e confirm=PROD --check --diff   # dry run first
#   ansible-playbook -i inventories/prod.yml install-systemd-units.yml \
#       -e instance="" -e confirm=PROD
#
# `instance` is mandatory and has no default: pass an empty value to work on an
# unsuffixed instance (/home/wjs/janeway). A silent default would happily write
# units for an instance you did not mean to touch.
#
# Restarting gunicorn drops the requests in flight: on production, pick a quiet
# moment. The template's knobs (e.g. -e gunicorn_workers=N) can be passed here
# as well.

---
- hosts: janeway
  remote_user: wjs
  # One machine at a time, and stop at the first failure rather than leaving
  # the fleet with a mix of old and new units.
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_user: wjs
    wjs_user_id: 1000
    instance_name: "{{ instance | mandatory }}"
    # "~" (not "+") because it stringifies its operands; see install_hydra.yml.
    suffix: "{{ '-' ~ instance_name if instance_name else '' }}"
    full_name: "janeway{{ suffix }}"
    workon_home: /home/wjs/.virtualenvs
    venv_root: "{{ workon_home }}/{{ full_name }}"
    unit_dir: /home/wjs/.config/systemd/user
    # Template basename -> one unit per instance, named <unit><suffix>.service.
    # The names must keep agreeing with scripts/deploy.sh.
    instance_units:
      - gunicorn
      - qcluster

  pre_tasks:

    - name: Guard against unintended production runs
      import_tasks: tasks/assert-production-opt-in.yml

    - name: Check that the instance exists
      stat:
        path: "/home/wjs/{{ full_name }}/src"
      register: instance_src

    - name: Refuse to write units for a missing instance
      assert:
        that:
          - instance_src.stat.exists
        fail_msg: >-
          /home/wjs/{{ full_name }}/src does not exist on {{ inventory_hostname }}:
          is "{{ instance_name }}" the right instance?

  tasks:

    - name: Install the systemd user units
      template:
        src: "systemd/{{ item }}.service.j2"
        dest: "{{ unit_dir }}/{{ item }}{{ suffix }}.service"
        owner: wjs
        group: wjs
        mode: '0644'
      loop: "{{ instance_units }}"
      register: rendered_units

    - name: Restart the units that changed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}{{ suffix }}.service"
        # daemon_reload runs before the restart, so the new unit file is the one used
        daemon_reload: yes
        enabled: yes
        state: restarted
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ wjs_user_id }}"
      loop: "{{ rendered_units.results }}"
      loop_control:
        label: "{{ item.item }}{{ suffix }}.service"
      when: item.changed
