# Add wjs-submission project to existing instance
#
# Call as
# ansible-playbook add-wjs-submission.ym -e instance_name="aaa" -e prerelease=1
#
# For production, run as
# Run as `ansible-playbook -i wjs-prod, add-wjs-submission.yml instance_name="janeway" --check
---
- hosts: test
  remote_user: wjs
  # become: yes
  vars:
    ansible_user: wjs
    wjs_user_id: 1000
    instance_name: "{{ instance | default('aaa', true) }}"
    suffix: "{{ ('-') + instance_name if (instance_name)  else ('') }}"
    full_name: "janeway{{ suffix }}"
    janeway_root: "/home/wjs/{{ full_name }}"
    workon_home: /home/wjs/.virtualenvs
    venv_root: "{{ workon_home }}/{{ full_name }}"
    python: "{{ venv_root }}/bin/python"
    pip: "{{ venv_root }}/bin/pip"
    pre: "{{ prerelease|default(false, true) }}"
    pip_pre: "{{ ('--pre ') if (pre) else ('') }}"
    janeway_version: "{{ ('wjs-prod__for-1767') if (pre) else ('wjs-production') }}"
    ansible_ssh_common_args: "-o ForwardAgent=yes"

  tasks:
    # - maintenace
    # - stop app & qcluster
    # - cd janeway git pull

    - name: Pull Janeway repo
      git:
        repo: git@gitlab.sissamedialab.it:wjs/janeway.git
        dest: "{{ janeway_root }}"
        version: "{{ janeway_version }}"
        accept_hostkey: true
        update: yes
        force: no

    - name: Install Janeway
      command: "{{ pip }} install -r requirements.txt -c constraints.txt"
      args:
        chdir: "{{ janeway_root }}"



    - name: Install WJS
      # This should cascade-install wjs-submission, themes, and search
      # because of dependencies.
      pip:
        name: wjs-jcom-profile
        state: present
        virtualenv: "{{ venv_root }}"
        extra_args: "{{ pip_pre }}--extra-index-url=https://gitlab.sissamedialab.it/api/v4/projects/60/packages/pypi/simple --force-reinstall"



    - name: Setup system
      command: "{{ item }}"
      loop:
        # Note: at this point, no management command can be used,
        # because there is reference from wjs_review to plugins/wjs_submission,
        # but the latter does not yet exist.
        #
        # Remove possibly existing link to wjs_submission plugin
        # (e.g., from previous runs of this play)
        - "rm -f {{ janeway_root }}/src/plugins/wjs_submission"
        - "ln -s {{ venv_root }}/lib/python3.11/site-packages/wjs/plugins/wjs_submission {{ janeway_root }}/src/plugins/"
        # Note that "link_plugins" links all plugins it finds in wjs/plugins, which is "shared" by all wjs projects, so all plugins should be linked
        - "{{ python }} -mmanage link_plugins"
        - "{{ python }} -mmanage install_plugins"
        - rm -f themes/JCOM-theme
        - "{{ python }} -mmanage install_themes"
        - "{{ python }} -mmanage migrate"
        - "{{ python }} -mmanage build_assets"
        - "{{ python }} -mmanage run_customizations"
        - "{{ python }} -mmanage load_default_settings"
      args:
        chdir: "{{ janeway_root }}/src"
      tags: todo

    - name: Restart gunicorn
      ansible.builtin.systemd_service:
        name: gunicorn-{{ instance_name }}.service
        state: restarted
        enabled: true
        scope: user
      become_user: wjs
      # should not be necessary, because wjs is `loginctl enable-linger`, but...
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ wjs_user_id }}"

    - name: Restart qcluster
      ansible.builtin.systemd_service:
        name: qcluster-{{ instance_name }}.service
        state: restarted
        enabled: true
        scope: user
      become_user: wjs
      # should not be necessary, because wjs is `loginctl enable-linger`, but...
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ wjs_user_id }}"
