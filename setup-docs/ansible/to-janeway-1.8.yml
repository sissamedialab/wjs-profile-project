# Adapt an existing Janeway instance to Janeway 1.8
#
# NC_PASSWORD="***" ansible-playbook to-janeway-1.8.yml  -e instance="aaa"
#
# or, for production (after check of all steps):
# ansible-playbook -i wjs-prod, add-wjs-submission.yml -e instance_name="janeway" --check
---
- hosts: test
  # for production, set "hosts: wjs-prod"
  remote_user: wjs
  vars:
    wjs_user_id: 1000
    nc_password: "{{ lookup('env', 'NC_PASSWORD') | default('cambiami-please', true) }}"
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default('cambiami-please', true) }}"
    instance_name: "{{ instance | default('aaa') }}"
    suffix: "{{ ('-') + instance_name if (instance_name != 'janeway')  else ('') }}"
    full_name: "janeway{{ suffix }}"
    workon_home: /home/wjs/.virtualenvs/
    venv_root: "{{ workon_home }}/{{ full_name }}"
    python: "{{ venv_root }}/bin/python"
    pip: "{{ venv_root }}/bin/pip"
    ansible_ssh_common_args: "-o ForwardAgent=yes"

  tasks:
    - name: Remove typesetting plugin
      file:
        path: "/home/wjs/{{ full_name }}/src/plugins/typesetting"
        state: absent

    - name: Switch to Janeway wjs-production
      command: git checkout wjs-production
      args:
        chdir: "/home/wjs/{{ full_name }}"

    - name: Fetch all from Janeway
      command: git fetch --all
      args:
        chdir: "/home/wjs/{{ full_name }}"

    - name: Pull Janeway wjs-production
      command: git reset --hard origin/wjs-production
      args:
        chdir: "/home/wjs/{{ full_name }}"

    - name: Install Janeway packages
      pip:
        requirements: "/home/wjs/{{ full_name }}/requirements.txt"
        extra_args: "-c /home/wjs/{{ full_name }}/constraints.txt"
        virtualenv: "{{ venv_root }}"

    - name: Uninstall WJS packages
      pip:
        name: "{{ item }}"
        state: absent
        virtualenv: "{{ venv_root }}"
      loop:
        - wjs-user-search
        - wjs-themes
        - wjs-submission
        - wjs-jcom-profile

    - name: Install WJS packages
      pip:
        name: "{{ item }}"
        virtualenv: "{{ venv_root }}"
      loop:
        - wjs_submission >= 2.0.0
        - wjs.jcom_profile >= 2.0.0
        - wjs.user_search >= 2.0.0
        - wjs_themes >= 2.0.0




    - name: Fix diverged migrations
      command: "{{ python }} -mmanage {{ item }}"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - "migrate submission 0082_article_abstract_es_article_title_es_section_name_es_and_more --fake"
        - "migrate submission 0083_article_jats_article_type_override_and_more --fake"
        - "migrate core 0100_contacts_name_es_contacts_role_es_and_more --fake"
        - "migrate submission 0088"
        - "migrate submission 0089_keyword_created_keyword_deactivated_keyword_notes_and_more --fake"
        - "migrate cms 0020_historicalpage_content_es_and_more --fake"
        - "migrate jcom_profile 0038_jcomprofile_alternative_email"
        - "migrate journal 0067_issue_cached_display_title_es_and_more --fake"
        - "migrate core 0110_one_click_review_on_by_default"
        - "migrate jcom_profile 0039_set_gdpr_acceptance"
        - "migrate journal 0068_issue_allowed_sections_issue_cached_display_title_pt_and_more --fake"
        - "migrate typesetting 0017_auto_20240708_1727"
        - "migrate typesetting 0018_selected_files --fake"

    - name: Standard operations
      command: "{{ python }} -mmanage {{ item }}"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - migrate
        - link_plugins
        - install_plugins
        - load_default_settings
        - sync_translation_fields --noinput
        - update_translation_fields
        - build_assets


    - name: ROR DB setup
      command: "{{ python }} -mmanage {{ item }}"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - import_ror_data  # --limit 130000
        - match_ror_ids    # --limit 130000
      ignore_errors: true

    # # TO BE DROPPED FOR PRODUCTION!!!
    # - name: Reset journal domains
    #   community.postgresql.postgresql_query:
    #     login_db: "{{ full_name }}"
    #     query: "{{ item }}"
    #     login_host: localhost
    #     login_port: 5432
    #     login_user: janeway
    #   loop:
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jcom.wjapp.it' WHERE code='JCOM';"
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jcomal.wjapp.it' WHERE code='JCOMAL';"
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jquant.wjapp.it' WHERE code='JQuant';"
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jcap.wjapp.it' WHERE code='JCAP';"
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jhep.wjapp.it' WHERE code='JHEP';"
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jsts.wjapp.it' WHERE code='JSTAT';"
    #     - "UPDATE journal_journal SET domain='wjs-test-{{ instance_name }}-jinst.wjapp.it' WHERE code='JINST';"
    #   environment:
    #     PGPASSFILE: /home/wjs/.pgpass



    - name: Import keywords
      command: "{{ python }} -mmanage import_keywords_json {{ venv_root }}/lib/python3.11/site-packages/wjs/plugins/wjs_submission/install/{{ item.file }} --journal={{ item.journal }} --clear"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - { file: jquant-kwds.json, journal: JQuant }
        ## JHEP and JCAP postponed until their turn 😉 - { file: jhep-kwds.json, journal: JHEP }



    - name: Ensure submission-config dirs for settings exist and are empty
      # [Claude] The trick to "create and ensure empty" with the file module is to do it in two passes:
      # first state: absent (removes the dir + contents),
      # then state: directory (recreates it empty).
      # I used product() to build the 8-item loop:
      #   JCOM → absent
      #   JCOM → directory
      #   JCOMAL → absent
      #   JCOMAL → directory
      #   ... etc
      ansible.builtin.file:
        path: "/tmp/{{ item.0 }}"
        state: "{{ item.1 }}"
        mode: '0755'
      loop: "{{ ['JCOM', 'JCOMAL', 'JQuant', 'JCAP'] | product(['absent', 'directory']) | list }}"

    - name: Download submission-config archives from Nextcloud
      ansible.builtin.command:
        argv:
          - curl
          - -sL
          - --fail
          - -u
          - "{{ item.share_id }}:{{ nc_password }}"
          - "https://medialab.sissa.it/nextcloud/public.php/dav/files/{{ item.share_id }}/?accept=zip"
          - -o
          - "/tmp/{{ item.journal }}.zip"
      loop:
        - { journal: JQuant, share_id: "53dCwQJaKny3wig" }
        - { journal: JCAP,   share_id: "CZrXCtMkMBjJL5C" }
        - { journal: JCOM,   share_id: "AzdbefkdoqmSDJX" }
        - { journal: JCOMAL, share_id: "r6nLPK6SZTywmze" }
      # omit from log, because of the pwd:
      no_log: true

    - name: Extract submission-config archives into staging dirs
      ansible.builtin.unarchive:
        src: "/tmp/{{ item }}.zip"
        dest: "/tmp/{{ item }}"
        remote_src: yes
      loop:
        - JQuant
        - JCAP
        - JCOM
        - JCOMAL



    - name: Importing settings - all
      command: "{{ python }} -W ignore -mmanage set_settings_from_csv --journal {{ item }} --csv '/tmp/{{ item }}/Submission settings/202603_all_settings.csv'"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - JQuant
        - JCAP
        - JCOM
        - JCOMAL

    - name: Importing settings - submission settings
      command: "{{ python }} -W ignore -mmanage set_settings_from_csv --journal {{ item }} --csv '/tmp/{{ item }}/Submission settings/202603_submission_settings.csv' --group-name submissionconfiguration"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - JQuant
        - JCAP
        - JCOM
        - JCOMAL

    - name: Importing settings - submission fields
      command: "{{ python }} -W ignore -mmanage set_settings_from_csv --journal {{ item }} --csv '/tmp/{{ item }}/Submission settings/202603_submission_fields.csv' --group-name submissionfields"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - JQuant
        - JCAP
        - JCOM
        - JCOMAL

    - name: Importing settings - WJS submission settings
      command: "{{ python }} -W ignore -mmanage set_settings_from_csv --journal {{ item }} --csv '/tmp/{{ item }}/Submission settings/202604_wjs_submission_settings.csv'"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - JQuant
        - JCAP
        - JCOM
        - JCOMAL

    - name: Configure access mode
      command: "{{ python }} -W ignore -mmanage setup_access_mode --clear-all"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"




    - name: Create Article linked models for submission data and article workflow
      # Do this after the settings in case the defaults depend on the settings
      command: "{{ python }} -W ignore -mmanage {{ item }}"
      args:
        chdir: "/home/wjs/{{ full_name }}/src"
      loop:
        - create_submission_data_unsubmitted
        - create_workflows_for_past_articles
