default:
  image: python:3.11
  # Runner must be inside Inasset's farm
  tags:
    - inasset

  cache:
    key: cache-default
    paths:
      - .cache

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

stages:
  - test
  - build
  - deploy

include:
  - project: 'wjs/wjs-profile-project'
    ref: wjs-production
    file: '.gitlab-ci-pkg-build-and-upload.yml'
  - project: 'wjs/wjs-profile-project'
    ref: ${CI_COMMIT_REF_NAME}
    file: '.gitlab-ci-pkg-deploy.yml'
  - project: 'wjs/wjs-profile-project'
    ref: ${CI_COMMIT_REF_NAME}
    file: '.gitlab-ci-run-tests.yml'
  - project: 'wjs/wjs-profile-project'
    ref: ${CI_COMMIT_REF_NAME}
    file: '.gitlab-ci-pre-commit.yml'


Run tests:
  # Always run tests, except for tags, which have tests already run on
  # them when the commit is made.
  except:
    - tags
  extends:
    - .run-tests


Pre-commit:
  # Always run linting, except for tags
  except:
    - tags
  extends:
    - .run-pre-commit


# Standalone job: this tests scripts/release.sh itself (a bash tool, unrelated
# to the Janeway/pytest app under test), so it does not extend .run-tests —
# it needs none of that template's Janeway image, Postgres service, or
# Django settings, only git/jq/glab/pre-commit on PATH.
Run release script tests:
  stage: test
  tags:
    - fast-test
  # Always run, except for tags, which have already been tested on the
  # commit that was tagged (same convention as "Run tests"/"Pre-commit").
  except:
    - tags
  variables:
    GIT_STRATEGY: clone
    GLAB_VERSION: "1.112.0"
  before_script:
    # jq/pre-commit/glab are required by scripts/release.sh's own preflight
    # check, and scripts/tests/test_preflight.sh asserts all of them resolve
    # on PATH — so they must be real, working binaries, not stubs.
    - apt-get update && apt-get install -y --no-install-recommends jq curl ca-certificates
    - curl -sSL -o /tmp/glab.deb "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.deb"
    - dpkg -i /tmp/glab.deb
    - pip install --no-cache-dir pre-commit
  script:
    - bash scripts/tests/run_tests.sh


Upload package:
  only:
    - tags
  extends:
    - .upload-package


Deploy to pre-production:
  environment: pre-production
  extends:
    - .deploy
  # Deploying to pp means installing the last released (uploaded) package,
  # so the job only makes sense in tag pipelines, after "Upload package".
  needs:
    - Upload package
  rules:
    # Manual because we don't want to risk resetting some on-going translation:
    - if: $CI_COMMIT_TAG
      when: manual
  # Do not block the pipeline waiting for the manual job
  # (with `rules`, manual jobs default to allow_failure: false)
  allow_failure: true
  variables:
    # TEST_SERVER_IP and TEST_SERVER_USER are defined in gitlab's group WJS
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    DEPLOY_CMD: "deploy-pp-profile"


Deploy to production:
  extends:
    - .deploy
  # Deploying to prod means installing the last released (uploaded) package,
  # so the job only makes sense in tag pipelines, after "Upload package".
  needs:
    - Upload package
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  allow_failure: true
  environment: production
  variables:
    SERVER_IP: "$PROD_SERVER_IP"
    SERVER_USER: "$PROD_SERVER_USER"
    DEPLOY_CMD: "deploy-prod-profile"


Deploy to dev:
  extends:
    - .deploy
  environment: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # The dev instance only deploys wjs-develop, so the job exists
    # only in pipelines for that branch (no rule matches elsewhere).
    - if: $CI_COMMIT_REF_NAME == "wjs-develop"
      when: on_success
  allow_failure: true
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    # The dev instance always deploys the wjs-develop branch (no ref accepted)
    DEPLOY_CMD: "deploy-dev-profile"


# ======================
# Deploy to T1-T5
# ======================
.deploy-to-test-template:
  extends:
    - .deploy
  when: manual
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    TEST_INSTANCE: "t1"
    DEPLOY_CMD: "deploy-${TEST_INSTANCE}-profile:${CI_COMMIT_SHA}"

Deploy to T1:
  environment: T1
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t1"

Deploy to T2:
  environment: T2
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t2"

Deploy to T3:
  environment: T3
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t3"

Deploy to T4:
  environment: T4
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t4"

Deploy to T5:
  environment: T5
  extends:
    - .deploy-to-test-template
  variables:
    TEST_INSTANCE: "t5"
