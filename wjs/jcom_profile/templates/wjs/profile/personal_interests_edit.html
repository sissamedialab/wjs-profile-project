{% extends "wjs/profile/base.html" %}

{% block profile_form %}
<h1 class="wjs-profile-form__title">Keywords</h1>
  <form class="wjs-profile-form" method="post" enctype="multipart/form-data">

    <div class="wjs-profile-form__main">
      {% csrf_token %}
      {% for value in form.keywords %}
        {% if value.data.value %}
        <div class="form-check d-flex flex-row">
          <input class="form-check-input" type="checkbox" name="{{ value.data.name }}" value="{{ value.data.value }}" id="{{ value.data.value }}" {% if value.data.selected %}checked{% endif %}>
          <label class="form-check-label" for="{{ value.data.value }}">
            {{ value.choice_label }}
          </label>
        </div>
        {% endif %}
      {% endfor %}
    </div>
    <div class="wjs-profile-form__footer">
      <button type="submit" class="wjs-profile-form__update-button">Update</button>
    </div>
  </form>
{% endblock profile_form %}
