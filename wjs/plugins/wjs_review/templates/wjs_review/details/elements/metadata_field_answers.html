<div class="accordion-item">
  <h2 class="accordion-header" id="heading-field-answers-{{ forloop.counter }}">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-field-answers-{{ forloop.counter }}" aria-expanded="false" aria-controls="collapse-field-answers-{{ forloop.counter }}">
      {% translate "Author's declarations" %}
    </button>
  </h2>
  <div id="collapse-field-answers-{{ forloop.counter }}" class="accordion-collapse collapse" aria-labelledby="heading-field-answers-{{ forloop.counter }}" data-bs-parent="#metadata">
    <div class="accordion-body">
      <table class="scroll small">
        {% for field_answer in article.fieldanswer_set.all %}
          <tr>
            <th colspan="3">{{ field_answer.field.name }}</th>
          </tr>
          <tr>
            <td colspan="3">{{ field_answer.answer|safe }}</td>
          </tr>
        {% endfor %}
          <tr>
            <th colspan="3">{% translate "Competing interests" %}</th>
          </tr>
          <tr>
            <td colspan="3">{{ article.competing_interests|safe }}</td>
          </tr>
      </table>
    </div>
  </div>
</div>
