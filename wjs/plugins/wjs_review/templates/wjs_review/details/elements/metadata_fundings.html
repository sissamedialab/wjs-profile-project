{% load i18n static wjs_review %}
<table class="scroll small mt-4">
  <thead>
  <tr>
    <th colspan="3"><h4 class="mb-0">{% translate "Funding" %}</h4></th>
  </tr>
  <tr>
    <th width="30%">Name</th>
    <th width="15%">Country</th>
    <th width="30%">Grant / award number</th>
  </tr>
  </thead>
  <tbody>
  {% for funding in article_fundings %}
    <tr>
      <td>{{ funding.name }}</td>
      <td>{{ funding.country|default:"-" }}</td>
      <td>{{ funding.funding_id|default:"-" }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
