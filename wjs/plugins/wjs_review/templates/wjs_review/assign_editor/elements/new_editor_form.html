{% load django_bootstrap5 i18n static %}
<script src="{% static "django_tinymce/init_tinymce.js" %}"></script>
<div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="id_set_visibility_rights" name="set_visibility_rights" {% if form.cleaned_data.set_visibility_rights %}checked{% endif %}>
  <label class="form-check-label" for="id_set_visibility_rights">{% translate "Set visibility rights (if turned on, a new page will open up for the details)" %}</label>
</div>
<div class="mt-3">
  {% bootstrap_field form.note_for_new_editor_subject %}
  {% bootstrap_field form.note_for_new_editor %}
</div>
