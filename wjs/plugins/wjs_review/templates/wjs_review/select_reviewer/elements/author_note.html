{% load django_bootstrap5 i18n wjs_permissions %}
<div class="card collapse select-reviewer-notes" id="authorNotesCollapse">
  <div class="card-body">
    <h5 class="card-title">{% translate "Cover letter" %}</h5>
    <div class="card-text">
      {{ review_version.cover_letter.text|safe }}
    </div>
    {% if review_version.cover_letter.file %}
      <h6>{% translate "Cover letter file" %}</h6>
      <ul class="list-group">
        <li class="list-group-item"><a href="{% url 'download_single_file' workflow.article.pk review_version.cover_letter.file.pk %}" target="_blank">{{ review_version.cover_letter.file.label }}</a></li>
      </ul>
    {% endif %}
  </div>
</div>
