{% load i18n %}
{% if attention_flag %}
  <div class="align-self-end dropdown">
    {% if attention_flag == "You have unread messages" %}
      <button
        type="button"
        class="badge rounded-circle bg-warning text-dark border-0 p-2 fs-6"
        data-bs-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="false"
        aria-label="{{ attention_flag }}"
      ><i class="bi bi-envelope" aria-hidden="true"></i></button>
      <ul class="dropdown-menu text-nowrap wjs-attention-dropdown-menu">
        <li>
          <a class="dropdown-item" href="{% url "wjs_article_messages" pk=workflow.pk %}">{{ attention_flag }} <i class="bi bi-box-arrow-up-right"></i></a>
        </li>
      </ul>
    {% else %}
      <button
        type="button"
        class="badge rounded-circle bg-warning text-dark border-0 p-2 fs-6"
        data-bs-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="false"
        aria-label="{{ attention_flag }}"
      ><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></button>
      <ul class="dropdown-menu text-nowrap wjs-attention-dropdown-menu">
        <li class="dropdown-item">{{ attention_flag }}</li>
      </ul>
    {% endif %}
  </div>
{% endif %}
