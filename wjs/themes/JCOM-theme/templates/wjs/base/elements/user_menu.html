{% load wjs_tags %}

<div class="dropdown">
  <button class="btn btn-outline-primary dropdown-toggle btn-sm d-flex gap-2 align-items-center" type="button" id="user-menu" data-bs-toggle="dropdown" aria-expanded="false">
    {% if show_name %}
      {{ request.user.get_full_name }} <span class="fs-3"><i class="bi bi-person-circle"></i></span>
    {% elif view.role %}
      {% translate "Viewing as" %}: {{ view.role_label }}
    {% else %}
      {% translate "Profile" %}
    {% endif %}
  </button>

   {% include "wjs/base/elements/user_menu_dropdown_list.html" %}
</div>
