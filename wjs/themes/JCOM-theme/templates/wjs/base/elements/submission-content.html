{% load static %}

<script src="{% static "js/submission.js" %}"></script>

<form method="post" action="" class="wjs-submission-form">
  {% csrf_token %}
  <div class="mb-3">
    <label class="wjs-submission-form__form-label" for="id_subject">Title</label>
    <div class="input-group">
      <span class="input-group-text">[JCOM_1634]</span>
      <input
        type="text"
        name="subject"
        value=""
        class="form-control"
        placeholder="Title"
        aria-required="true"
        id="id_subject"
        required
      />
    </div>
  </div>

  <div class="form-check mb-3">
    <input type="checkbox" name="checkbox" class="form-check-input" id="id_checkbox" required aria-required="true" />
    <label class="form-check-label" for="id_checkbox"> A checkbox </label>
  </div>

  <div class="mb-3">
    <label class="wjs-submission-form__form-label" for="id_select">A select</label>
    <select name="select" class="form-select" required aria-required="true" id="id_select">
      <option value="" selected>Select one decision</option>
      <option value="accept">Accept</option>
      <option value="reject">Reject</option>
      <option value="minor_revisions">Minor revision</option>
      <option value="major_revisions">Major revision</option>
      <option value="tech_revisions">Change Metadata</option>
      <option value="not_suitable">Not suitable</option>
      <option value="requires_resubmission">Requires resubmission</option>
      <option value="open_appeal">Open appeal</option>
    </select>
  </div>

  <fieldset class="mb-3">
    <legend class="wjs-submission-form__form-label">Radio</legend>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="radio_group"
        id="radio1"
        value="option1"
        required
        aria-required="true"
      />
      <label class="form-check-label" for="radio1">Option 1</label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="radio_group"
        id="radio2"
        value="option2"
        aria-required="true"
      />
      <label class="form-check-label" for="radio2">Option 2</label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="radio_group"
        id="radio3"
        value="option3"
        aria-required="true"
      />
      <label class="form-check-label" for="radio3">Option 3</label>
    </div>
  </fieldset>

  <div class="mb-3">
    <label class="wjs-submission-form__form-label" for="id_textarea">Textarea</label>
    <textarea
      id="id_textarea"
      name="message"
      class="form-control"
      rows="4"
      required
      aria-required="true"
      placeholder="Type your message here..."
    ></textarea>
  </div>

  <div class="mb-3">
    <label class="wjs-submission-form__form-label" for="id_file">Upload file</label>
    <input type="file" id="id_file" name="file_upload" class="form-control" required aria-required="true" />
  </div>

  <div class="mb-3">
  <label class="wjs-submission-form__form-label" for="arxiv-id-input">ArXiv</label>
  <div class="wjs-submission-form__arxiv-validation-wrapper">
    <input id="arxiv-id-input" name="arxiv_id" class="form-control" placeholder="Enter arXiv ID" required aria-required="true" />

    <button
      class="btn btn-primary"
      id="js-arxiv-validation-btn"
      hx-post="{% url 'arxiv_microservice' %}"
      hx-include="#arxiv-id-input"
      hx-target="#js-arxiv-validation-result"
      disabled
      aria-label="Validate ArXiv ID"
      type="button"
    >
      Validate ArXiv ID
    </button>
  </div>
  <div class="wjs-submission-form__arxiv-validation-messages-wrapper" tabindex="-1">
    <div id="js-arxiv-validation-result" class="wjs-submission-form__arxiv-validation-result d-none" role="alert" aria-live="assertive"></div>
    <p id="js-arxiv-validation-suggestion" class="wjs-submission-form__arxiv-validation-suggestion d-none">
      ArXiv ID must be in the following format: nnnn.nnnnn
    </p>
  </div>
  <div id="js-arxiv-validation-loader" class="wjs-submission-form__arxiv-validation-loader d-none" role="status" aria-live="polite">
    <i class="wjs-submission-form__arxiv-validation-loader-icon bi bi-arrow-clockwise"></i> Validating...
  </div>
</div>

  <div id="form-footer">
    <button type="submit" class="btn btn-primary" id="submit-btn" disabled>Save and continue</button>
  </div>
</form>
